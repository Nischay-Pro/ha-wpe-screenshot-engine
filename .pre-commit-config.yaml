repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.11.0
    hooks:
      - id: shellcheck

  - repo: https://github.com/hadolint/hadolint
    rev: v2.15.1
    hooks:
      - id: hadolint-docker
        # Keep Debian packages current instead of pinning individual package versions.
        args: [--ignore, DL3008]

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff-check
      - id: ruff-format

  - repo: local
    hooks:
      - id: cppcheck
        name: Cppcheck C static analysis
        entry: >-
          cppcheck --quiet --enable=warning,performance,portability
          --error-exitcode=1 --inline-suppr --suppress=missingIncludeSystem
          --std=c11 --language=c
        language: system
        types: [c]
        files: ^wpe_screenshot_engine/src/.*\.c$

      - id: yamllint
        name: yamllint YAML style
        entry: yamllint
        language: system
        types: [yaml]
