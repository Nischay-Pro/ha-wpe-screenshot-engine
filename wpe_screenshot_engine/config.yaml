name: WPE Screenshot Engine
slug: wpe_screenshot_engine
version: 0.4.0
description: Headless WPE WebKit screenshot renderer for Home Assistant dashboards
url: https://github.com/Nischay-Pro/ha-wpe-screenshot-engine
image: ghcr.io/nischay-pro/ha-wpe-screenshot-engine
arch:
  - aarch64
  - amd64
startup: services
tmpfs: true
ports:
  8080/tcp: 19433
ports_description:
  8080/tcp: Host port for the HA MCP screenshot client (default 19433)
options:
  home_assistant_url: http://homeassistant:8123
  home_assistant_ca_certificate: ''
  dashboard_path: lovelace/energy
  render_deadline_seconds: 55
  dashboard_reuse_idle_seconds: 300
  webkit_process_memory_limit_mb: 512
  max_auto_height: 12000
  full_page_tile_wait_ms: 250
  frontend_options_timeout_ms: 10000
  allowed_hosts: ''
schema:
  home_assistant_url: str
  home_assistant_ca_certificate: str?
  home_assistant_token: password(1,8192)
  dashboard_path: str
  expected_text: str?
  render_deadline_seconds: int(1,300)
  dashboard_reuse_idle_seconds: int(0,3600)
  webkit_process_memory_limit_mb: int(512,3072)
  max_auto_height: int(1000,12000)
  full_page_tile_wait_ms: int(0,5000)
  frontend_options_timeout_ms: int(1000,60000)
  allowed_hosts: str?
map:
  - ssl:ro
