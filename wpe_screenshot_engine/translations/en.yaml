configuration:
  home_assistant_url:
    name: Home Assistant URL
    description: Base HTTP or HTTPS origin of Home Assistant.
  home_assistant_ca_certificate:
    name: Home Assistant CA certificate
    description: >-
      Optional path to a PEM CA certificate stored under /ssl. Use this for
      HTTPS installations that use a private certificate authority.
  home_assistant_token:
    name: Home Assistant access token
    description: >-
      Long-lived token for a dedicated, non-admin Home Assistant user. This
      value is entered in a masked password field and can use a Home Assistant
      !secret reference.
  dashboard_path:
    name: Readiness check route
    description: >-
      Route where the optional readiness text is checked. Screenshot requests
      can target any safe Home Assistant dashboard route.
  expected_text:
    name: Readiness text
    description: >-
      Optional visible text checked on the readiness route. Leave blank to skip
      the text check; other requested dashboard routes do not use this text.
  render_deadline_seconds:
    name: Render deadline
    description: Maximum time allowed for one dashboard capture.
  dashboard_reuse_idle_seconds:
    name: Renderer idle timeout
    description: >-
      Keep the WebKit renderer warm for this many idle seconds. When the timer
      expires, its web process is terminated to reduce idle memory; the next
      screenshot starts a fresh renderer. Set to 0 to release it after each
      request.
  webkit_process_memory_limit_mb:
    name: WebKit memory pressure target
    description: Per-process WebKit memory target, from 512 to 3072 MiB.
network:
  8080/tcp: Host port mapped to the internal screenshot API (default 19433).
