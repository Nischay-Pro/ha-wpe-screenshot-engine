name: Lint

on:
  push:
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  pre-commit:
    name: Lint source and workflow files
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install system linters
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes cppcheck shellcheck yamllint

      - name: Run pre-commit hooks
        uses: pre-commit/action@v3.0.1

  home-assistant-config:
    name: Lint Home Assistant app configuration
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Run Home Assistant app linter
        uses: frenck/action-app-linter@v2.21.1
        with:
          path: ./wpe_screenshot_engine
