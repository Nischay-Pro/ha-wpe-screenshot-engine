name: Test Home Assistant app

on:
  push:
  pull_request:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions: {}

env:
  ARCHITECTURES: '["amd64", "aarch64"]'
  IMAGE_NAME: ha-wpe-screenshot-engine
  REGISTRY_PREFIX: ghcr.io/nischay-pro

jobs:
  prepare:
    name: Prepare test matrix
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Create architecture matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@2026.09.0
        with:
          architectures: ${{ env.ARCHITECTURES }}
          image-name: ${{ env.IMAGE_NAME }}
          registry-prefix: ${{ env.REGISTRY_PREFIX }}

  build-and-test:
    name: Test ${{ matrix.arch }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Run pixel conversion tests
        run: >-
          docker buildx build --output=type=cacheonly
          --file wpe_screenshot_engine/Dockerfile.test
          wpe_screenshot_engine

      - name: Build app image
        uses: home-assistant/builder/actions/build-image@2026.09.0
        with:
          arch: ${{ matrix.arch }}
          context: wpe_screenshot_engine
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          cosign: "false"
          image: ${{ matrix.image }}
          image-tags: ci-${{ github.sha }}
          load: "true"
          push: "false"
          version: ci-${{ github.sha }}

      - name: Run HTTP and security regression tests
        env:
          WPE_IMAGE: ${{ matrix.image }}:ci-${{ github.sha }}
        run: python3 -m unittest discover -s tests -v

      - name: Run pinned HA MCP fixture integration
        env:
          WPE_IMAGE: ${{ matrix.image }}:ci-${{ github.sha }}
        run: sh tests/run_mcp_fixture_integration.sh

  supervisor-install:
    # Keep this name aligned with the required status check on main.
    name: Home Assistant Supervisor install integration
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Prepare previous release app fixture
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous_version="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name')"
          if [[ ! "${previous_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Latest GitHub release tag is not a numeric app version: ${previous_version}"
            exit 1
          fi

          git fetch --depth=1 origin \
            "refs/tags/${previous_version}:refs/tags/${previous_version}"
          baseline_dir="${GITHUB_WORKSPACE}/tests/.upgrade-baseline"
          mkdir -p "${baseline_dir}"
          git archive "${previous_version}" wpe_screenshot_engine \
            | tar -x -C "${baseline_dir}"
          printf '%s\n' "${previous_version}" > "${baseline_dir}/VERSION"

      - name: Install Dev Container CLI
        run: npm install --global @devcontainers/cli

      - name: Start Home Assistant apps devcontainer
        run: >-
          devcontainer up --workspace-folder "$GITHUB_WORKSPACE"
          --config "$GITHUB_WORKSPACE/tests/.devcontainer.json"

      - name: Start Home Assistant Supervisor
        shell: bash
        run: |
          devcontainer exec --workspace-folder "$GITHUB_WORKSPACE" \
            --config "$GITHUB_WORKSPACE/tests/.devcontainer.json" \
            bash -lc 'nohup supervisor_run >/tmp/wpe-supervisor.log 2>&1 </dev/null &'

          attempt=0
          while [ "$attempt" -lt 180 ]; do
            attempt=$((attempt + 1))
            if devcontainer exec --workspace-folder "$GITHUB_WORKSPACE" \
              --config "$GITHUB_WORKSPACE/tests/.devcontainer.json" \
              ha --no-progress info --raw-json \
              | jq -e '.data.state == "running"' >/dev/null 2>&1; then
              echo "Home Assistant Supervisor is running."
              exit 0
            fi
            sleep 2
          done

          devcontainer exec --workspace-folder "$GITHUB_WORKSPACE" \
            --config "$GITHUB_WORKSPACE/tests/.devcontainer.json" \
            bash -lc 'tail -80 /tmp/wpe-supervisor.log' || true
          echo "Home Assistant Supervisor did not become ready." >&2
          exit 1

      - name: Test fresh install and previous-release upgrade through Supervisor
        run: >-
          devcontainer exec --workspace-folder "$GITHUB_WORKSPACE"
          --config "$GITHUB_WORKSPACE/tests/.devcontainer.json"
          sh tests/run_supervisor_install_upgrade_integration.sh

      - name: Stop Home Assistant apps devcontainer
        if: always()
        shell: bash
        run: |
          container_ids=$(docker ps -aq \
            --filter "label=devcontainer.local_folder=$GITHUB_WORKSPACE")

          if [ -n "$container_ids" ]; then
            while IFS= read -r container_id; do
              docker rm --force --volumes "$container_id"
            done <<< "$container_ids"
          fi

      - name: Remove previous release fixture
        if: always()
        run: rm -rf -- "$GITHUB_WORKSPACE/tests/.upgrade-baseline"
