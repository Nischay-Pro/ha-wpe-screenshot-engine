name: Publish Home Assistant app images

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: App version from wpe_screenshot_engine/config.yaml to republish
        required: true
        type: string
  workflow_run:
    workflows: [Test Home Assistant app]
    types: [completed]
    branches: [main]

permissions: {}

env:
  ARCHITECTURES: '["amd64", "aarch64"]'
  IMAGE_NAME: ha-wpe-screenshot-engine
  REGISTRY_PREFIX: ghcr.io/nischay-pro

jobs:
  prepare:
    name: Prepare image build
    if: >-
      github.event_name == 'release' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      (github.event.workflow_run.event == 'push' ||
      github.event.workflow_run.event == 'schedule'))
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    timeout-minutes: 60
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      image_tags: ${{ steps.metadata.outputs.image_tags }}
      skip_existing: ${{ steps.metadata.outputs.skip_existing }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - name: Check out tested source
        uses: actions/checkout@v7.0.1
        with:
          ref: >-
            ${{ github.event_name == 'release' && github.event.release.tag_name
                || (github.event_name == 'workflow_run' && github.event.workflow_run.head_sha)
                || inputs.version }}
          persist-credentials: false

      - name: Wait for test and lint workflows to pass for this revision
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_EVENT: >-
            ${{ github.event_name == 'release' && 'release'
                || (github.event_name == 'workflow_run' && github.event.workflow_run.event)
                || 'workflow_dispatch' }}
          EXPECTED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || '' }}
        shell: bash
        run: |
          source_sha="$(git rev-parse HEAD)"
          if [[ -n "${EXPECTED_SHA}" && "${source_sha}" != "${EXPECTED_SHA}" ]]; then
            echo "::error::Checked-out source does not match the completed test workflow revision."
            exit 1
          fi

          case "${SOURCE_EVENT}" in
            push)
              test_event=push
              lint_event=push
              ;;
            schedule)
              test_event=schedule
              lint_event=push
              ;;
            release|workflow_dispatch)
              test_event=push
              lint_event=push
              ;;
            *)
              echo "::error::Unsupported CI source event: ${SOURCE_EVENT}"
              exit 1
              ;;
          esac

          echo "Waiting for successful test and lint runs for ${source_sha}."
          deadline=$((SECONDS + 3300))
          while (( SECONDS < deadline )); do
            runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${source_sha}&per_page=100")"
            latest_run_filter="[.workflow_runs[] | select(.name == \$name and .head_sha == \$sha and .event == \$event)]
              | sort_by([.run_number, .run_attempt])
              | if length == 0 then empty else .[-1] end"
            test_run="$(jq -c --arg name 'Test Home Assistant app' --arg sha "${source_sha}" --arg event "${test_event}" \
              "${latest_run_filter}" <<< "${runs}")"
            lint_run="$(jq -c --arg name 'Lint' --arg sha "${source_sha}" --arg event "${lint_event}" \
              "${latest_run_filter}" <<< "${runs}")"

            test_status="$(jq -r '.status // "missing"' <<< "${test_run:-{}}")"
            test_conclusion="$(jq -r '.conclusion // ""' <<< "${test_run:-{}}")"
            lint_status="$(jq -r '.status // "missing"' <<< "${lint_run:-{}}")"
            lint_conclusion="$(jq -r '.conclusion // ""' <<< "${lint_run:-{}}")"

            if [[ "${test_status}" == completed && "${test_conclusion}" != success ]]; then
              echo "::error::Test workflow concluded with ${test_conclusion}."
              exit 1
            fi
            if [[ "${lint_status}" == completed && "${lint_conclusion}" != success ]]; then
              echo "::error::Lint workflow concluded with ${lint_conclusion}."
              exit 1
            fi
            if [[ "${test_status}" == completed && "${test_conclusion}" == success \
               && "${lint_status}" == completed && "${lint_conclusion}" == success ]]; then
              echo "Both test and lint workflows passed for ${source_sha}."
              exit 0
            fi

            sleep 15
          done

          echo "::error::Timed out waiting for successful test and lint runs for ${source_sha}."
          exit 1

      - name: Set image tags
        id: metadata
        env:
          SOURCE_EVENT: >-
            ${{ github.event_name == 'release' && 'release'
                || (github.event_name == 'workflow_run' && github.event.workflow_run.event)
                || 'workflow_dispatch' }}
          SOURCE_SHA: ${{ github.event_name == 'release' && github.sha || github.event.workflow_run.head_sha || github.sha }}
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.version }}
        shell: bash
        run: |
          app_version="$(awk -F '"' '/^version:/ { print $2; exit }' wpe_screenshot_engine/config.yaml)"
          if [[ -z "${app_version}" ]]; then
            echo "::error::Could not read app version from config.yaml."
            exit 1
          fi

          skip_existing=""
          case "${SOURCE_EVENT}" in
            release)
              if [[ "${RELEASE_TAG}" != "${app_version}" ]]; then
                echo "::error::Release tag must exactly match config.yaml version (${app_version})."
                exit 1
              fi
              version="${app_version}"
              image_tags="$(printf '%s\nlatest' "${app_version}")"
              skip_existing="${app_version}"
              ;;
            workflow_dispatch)
              if [[ "${RELEASE_TAG}" != "${app_version}" ]]; then
                echo "::error::Manual republish version must exactly match config.yaml version (${app_version})."
                exit 1
              fi
              version="${app_version}"
              image_tags="$(printf '%s\nlatest' "${app_version}")"
              ;;
            push)
              version="edge-${SOURCE_SHA:0:12}"
              image_tags="$(printf 'sha-%s\nedge' "${SOURCE_SHA}")"
              ;;
            schedule)
              version="nightly-$(date -u +%Y%m%d)-${SOURCE_SHA:0:12}"
              image_tags="$(printf '%s\nnightly' "${version}")"
              ;;
            *)
              echo "::error::Unsupported source event: ${SOURCE_EVENT}"
              exit 1
              ;;
          esac

          {
            echo "image_tags<<EOF"
            printf '%s\n' "${image_tags}"
            echo "EOF"
            echo "skip_existing=${skip_existing}"
            echo "version=${version}"
          } >> "${GITHUB_OUTPUT}"

      - name: Create architecture matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@2026.09.0
        with:
          architectures: ${{ env.ARCHITECTURES }}
          image-name: ${{ env.IMAGE_NAME }}
          registry-prefix: ${{ env.REGISTRY_PREFIX }}

  build:
    name: Build and publish ${{ matrix.arch }} image
    needs: prepare
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Check out tested source
        uses: actions/checkout@v7.0.1
        with:
          ref: >-
            ${{ github.event_name == 'release' && github.event.release.tag_name
                || (github.event_name == 'workflow_run' && github.event.workflow_run.head_sha)
                || inputs.version }}
          persist-credentials: false

      - name: Build and publish image
        uses: home-assistant/builder/actions/build-image@2026.09.0
        with:
          arch: ${{ matrix.arch }}
          context: wpe_screenshot_engine
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image: ${{ matrix.image }}
          image-tags: ${{ needs.prepare.outputs.image_tags }}
          push: "true"
          skip-existing: ${{ needs.prepare.outputs.skip_existing }}
          version: ${{ needs.prepare.outputs.version }}

  manifest:
    name: Publish multi-architecture manifest
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      packages: write
    steps:
      - name: Publish manifest
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@2026.09.0
        with:
          architectures: ${{ env.ARCHITECTURES }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-name: ${{ env.IMAGE_NAME }}
          image-tags: ${{ needs.prepare.outputs.image_tags }}
          registry-prefix: ${{ env.REGISTRY_PREFIX }}
