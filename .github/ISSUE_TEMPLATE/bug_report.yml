name: Report a screenshot engine bug
description: Report a reproducible problem with the Home Assistant app.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Use this form for bugs in the WPE Screenshot Engine app. For bugs in
        HA MCP itself, report them at https://github.com/homeassistant-ai/ha-mcp/issues.

        Never include an access token. Redact Home Assistant URLs, dashboard
        contents, and logs that contain private information. Avoid uploading
        screenshots unless they have been checked and redacted.

  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include what you expected and what happened instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: 1. Configure the app ...
    validations:
      required: true

  - type: input
    id: app_version
    attributes:
      label: App version
      description: Shown on the app information page in Home Assistant.
      placeholder: 0.1.3
    validations:
      required: true

  - type: dropdown
    id: architecture
    attributes:
      label: Host architecture
      options:
        - amd64
        - aarch64 (ARM64)
        - Other
    validations:
      required: true

  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
      placeholder: 2026.10.0
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Redacted app logs
      description: Remove tokens, private URLs, and dashboard data before pasting.
      render: text

  - type: textarea
    id: additional
    attributes:
      label: Additional details
      description: Add other information that helps reproduce the issue.
